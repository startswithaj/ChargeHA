name: CI

on:
  push:
    branches: [main]
  # No base-branch filter: a PR stacked on a feature branch needs the same
  # test and build signal as one targeting main. Release and deploy stay off
  # regardless — they gate on a push to main below.
  pull_request:
  workflow_dispatch:

# Collapse redundant runs on rapid pushes to the same ref. Never cancel a main
# run mid-flight — it builds + releases.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    uses: ./.github/workflows/test.yml

  # Only for branches living in this repo. A fork PR's head is untrusted and
  # its token cannot push an image anyway, so building it burns runner time
  # for nothing — maintainers use the /build comment in build-pr.yml instead.
  build:
    needs: test
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
      pull-requests: write

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      packages: write

  deploy-demo:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/demo.yml
    permissions:
      contents: read
      pages: write
      id-token: write
