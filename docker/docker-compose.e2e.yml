# E2E stack: real app + fake devices on a fixed subnet so discovery tests
# can scan deterministically.
services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      - PORT=8000
      - DB_PATH=/tmp/e2e-chargeha.db # inside the container, discarded on exit
      - RESET_AUTH=true # exact string — the code checks === "true", not truthiness
      - LOG_LEVEL=debug
    # The image's HEALTHCHECK polls every 30s — too slow for test startup.
    # Same probe, fast cadence; `up --wait` blocks until healthy.
    healthcheck:
      test:
        [
          "CMD",
          "deno",
          "run",
          "--allow-net",
          "packages/server/src/healthcheck.ts",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    ports:
      - "18000:8000"
    networks:
      e2e:
        ipv4_address: 172.30.99.10

  tapo-simulator:
    build:
      context: ..
      dockerfile: devtools/tapo-simulator/Dockerfile
    ports:
      - "18081:8081" # control API for the test runner
    networks:
      e2e:
        ipv4_address: 172.30.99.50

  ocpp-vcp:
    build:
      context: ..
      dockerfile: docker/vcp.Dockerfile
    environment:
      - WS_URL=ws://app:8000/api/charger/ocpp
      - CP_ID=vcp-test
      - ADMIN_PORT=9999
      # PASSWORD intentionally unset for the default suite; the Basic Auth
      # test sets the AuthorizationKey mid-suite and restarts this service
      # with PASSWORD via a dedicated compose override (see review note 1).
    ports:
      - "19999:9999" # admin API for the test runner
    depends_on:
      app:
        condition: service_healthy # start only once the app probe passes
    restart: on-failure # belt-and-braces if the first connect still races
    networks:
      e2e:
        ipv4_address: 172.30.99.60

networks:
  e2e:
    ipam:
      config:
        - subnet: 172.30.99.0/24
